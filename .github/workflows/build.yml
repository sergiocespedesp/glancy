# Builds and tests the engine and the app, and compiles the setup. A tag vX.Y.Z (equal to <Version> in
# Directory.Build.props) also publishes a GitHub release with the setup attached. Signing (SignPath) goes between
# "Build the setup" and the uploads once the project is accepted.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Rust (x86_64-pc-windows-gnu)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: .NET tests
        run: dotnet test --project tests/Glancy.Core.Tests/Glancy.Core.Tests.csproj

      - name: Build the setup (engine with Cargo tests, self-contained app, Inno Setup)
        shell: pwsh
        run: ./tools/build-installer.ps1

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/Installer/GlancySetup-*.exe | Select-Object -First 1
          if ("GlancySetup-$($env:GITHUB_REF_NAME.TrimStart('v')).exe" -ne $setup.Name) {
            throw "Tag $env:GITHUB_REF_NAME does not match $($setup.Name): update <Version> in Directory.Build.props."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GlancySetup
          path: dist/Installer/GlancySetup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GlancySetup
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" GlancySetup-*.exe --repo "$GITHUB_REPOSITORY" --title "Glancy ${GITHUB_REF_NAME#v}" --generate-notes
